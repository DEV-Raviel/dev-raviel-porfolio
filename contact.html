<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code with | Contact</title>
    
    <!-- Google Fonts for Gloock -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <!-- Persistent Navbar -->
    <nav class="navbar">
        <ul>
            <div class="nav-indicator"></div>
            <li><a href="index.html">Home</a></li>
            <li><a href="about_me.html">About Me</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>    
    </nav>

    <!-- Main Contact Container -->
    <main class="contact-container">
        <!-- Header Title with Metallic Gradient -->
        <header class="contact-header">
            <h1 class="contact-hero-title">Ready to <em>collaborate?</em></h1>
            <p class="contact-subtitle">Code with me by filling out the form below :)</p>
        </header>

        <!-- Glassmorphic Form Card -->
        <div class="contact-card">
            <form class="contact-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Enter subject">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Send Message</span>
                </button>
            </form>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
